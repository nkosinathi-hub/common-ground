# GitLab is the primary forge. Jobs mirror `pnpm guard` step by step (scripts/guard/index.ts);
# deployment jobs are manual. Every job shares the `.on-change` rules, so each `needs:` producer
# runs whenever its consumer does (the superset rule holds by construction).
stages: [static, test, build, e2e, deploy]

include:
  - local: .gitlab/ci/verify.yml
  - local: .gitlab/ci/database.yml
  - local: .gitlab/ci/deploy.yml
  - local: .gitlab/ci/android.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"

default:
  image: node:24-bookworm
  before_script:
    - corepack enable && corepack prepare pnpm@10.34.3 --activate
    - pnpm install --frozen-lockfile
  cache:
    key: { files: [pnpm-lock.yaml] }
    paths: [.pnpm-store]
  interruptible: true

variables:
  npm_config_store_dir: .pnpm-store
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_ANON_KEY: ci-placeholder

.on-change:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
