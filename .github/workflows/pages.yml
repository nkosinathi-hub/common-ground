name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The signed Android APK, published with the site at app/ (docs/runbooks/android.md).
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      CG_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
      CG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      CG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - env: # signing key and Firebase client config
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$CG_KEYSTORE_FILE"
          echo "$GOOGLE_SERVICES" | base64 -d > android/app/google-services.json
          bash scripts/android/version.sh >> "$GITHUB_ENV"
          if [ -s android/app/google-services.json ]; then echo VITE_PUSH=on >> "$GITHUB_ENV"; fi
      - run: pnpm exec vite build --mode app && pnpm exec cap sync android
      - run: ./gradlew --no-daemon -q assembleRelease
        working-directory: android
      - run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/common-ground.apk
          printf '{"version":"%s","apk":"common-ground.apk"}\n' "$CG_VERSION_NAME" > release/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: release

  build:
    needs: apk
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      PAGES_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm exec tsx scripts/guard/static-checks.ts
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm exec vitest run --coverage
      - run: pnpm build
      - run: pnpm exec tsx scripts/guard/bundle-scan.ts
      - run: cp dist/index.html dist/404.html
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
