name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The signed Android APK, published with the site at app/ (docs/runbooks/android.md).
  apk:
    uses: ./.github/workflows/apk.yml
    secrets: inherit

  # The Netflix watch party extension, published beside it (docs/runbooks/netflix-party.md).
  extension:
    uses: ./.github/workflows/extension.yml

  build: # the site ships even when the APK or the extension fails; each is then absent
    needs: [apk, extension]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_JELLYFIN_ORIGIN: ${{ vars.VITE_JELLYFIN_ORIGIN }}
      VITE_CINEPRO_CORE_ORIGIN: ${{ vars.VITE_CINEPRO_CORE_ORIGIN }}
      PAGES_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm exec tsx scripts/guard/static-checks.ts
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm exec vitest run --coverage
      - run: pnpm build
      - run: pnpm exec tsx scripts/guard/bundle-scan.ts
      - run: cp dist/index.html dist/404.html
      - uses: actions/download-artifact@v4
        if: needs.apk.result == 'success'
        with:
          name: apk
          path: dist/app
      - uses: actions/download-artifact@v4
        if: needs.extension.result == 'success'
        with:
          name: extension
          path: dist/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
