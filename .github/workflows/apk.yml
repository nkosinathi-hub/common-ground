# Builds the signed Android APK and version.json for the site's app/ folder (pages.yml).
name: Android APK

on:
  workflow_call:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      CG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      CG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - env: # signing key and Firebase client config
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "CG_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "$GOOGLE_SERVICES" | base64 -d > android/app/google-services.json
          bash scripts/android/version.sh >> "$GITHUB_ENV"
          if [ -s android/app/google-services.json ]; then echo VITE_PUSH=on >> "$GITHUB_ENV"; fi
      - run: pnpm exec vite build --mode app && pnpm exec cap sync android
      - run: ./gradlew --no-daemon -q assembleRelease
        working-directory: android
      - run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/common-ground.apk
          printf '{"version":"%s","apk":"common-ground.apk"}\n' "$CG_VERSION_NAME" > release/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: release
