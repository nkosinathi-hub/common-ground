# The fast guard steps. No services; each job is independent and runs in parallel.
format:
  extends: .on-change
  stage: static
  script: [pnpm format:check]

audit:
  extends: .on-change
  stage: static
  script: [pnpm audit --audit-level high]

static:
  extends: .on-change
  stage: static
  script: [pnpm exec tsx scripts/guard/static-checks.ts]

lint:
  extends: .on-change
  stage: static
  script: [pnpm lint]

deadcode:
  extends: .on-change
  stage: static
  script: [pnpm deadcode]

cycles:
  extends: .on-change
  stage: static
  script: [pnpm cycles]

duplication:
  extends: .on-change
  stage: static
  script: [pnpm duplication]

check:
  extends: .on-change
  stage: static
  script: [pnpm check]

unit:
  extends: .on-change
  stage: test
  script: [pnpm exec vitest run --coverage]
  coverage: '/All files[^|]*\|\s*([\d.]+)/'
  artifacts:
    when: always
    paths: [coverage/]
    expire_in: 1 week

functions:
  extends: .on-change
  stage: static
  image: denoland/deno:2.1.4
  before_script: []
  cache: []
  script:
    - cd supabase/functions
    - deno check --frozen catalog/index.ts attachments/index.ts push/index.ts simkl/index.ts

build:
  extends: .on-change
  stage: build
  script: [pnpm build]
  artifacts:
    paths: [dist/]
    expire_in: 1 day

bundle:
  extends: .on-change
  stage: build
  needs: [build]
  script: [pnpm exec tsx scripts/guard/bundle-scan.ts]
