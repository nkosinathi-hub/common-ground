# Production Supabase: migrations, Edge Functions and secrets. Manual, from main only.
# Needs masked CI variables: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD,
# TMDB_ACCESS_TOKEN, CLEANUP_SECRET, ALLOWED_ORIGINS, SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY.
supabase-deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: manual
  script:
    - pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
    - pnpm exec supabase db push --password "$SUPABASE_DB_PASSWORD"
    - pnpm exec supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
    - >
      pnpm exec supabase secrets set --project-ref "$SUPABASE_PROJECT_REF"
      TMDB_ACCESS_TOKEN="$TMDB_ACCESS_TOKEN" CLEANUP_SECRET="$CLEANUP_SECRET"
      ALLOWED_ORIGINS="$ALLOWED_ORIGINS"

# Free-tier projects pause after a week idle. A daily schedule keeps production awake
# and runs attachment cleanup.
keep-alive:
  stage: deploy
  before_script: []
  image: curlimages/curl:8.11.1
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - curl -fsS "$SUPABASE_URL/rest/v1/" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -o /dev/null
    - >
      [ -z "$CLEANUP_SECRET" ] || curl -fsS -X POST "$SUPABASE_URL/functions/v1/attachments"
      -H "x-cleanup-secret: $CLEANUP_SECRET" -H "content-type: application/json"
      -d '{"action":"cleanup"}' -o /dev/null
