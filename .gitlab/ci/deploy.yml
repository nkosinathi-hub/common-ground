# Production Supabase: migrations, Edge Functions and secrets. Manual, from main only.
# Needs masked CI variables: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD,
# TMDB_ACCESS_TOKEN, CLEANUP_SECRET, ALLOWED_ORIGINS, SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY,
# PUSH_SECRET (hex), FCM_SERVICE_ACCOUNT (base64 key file). See docs/runbooks/push.md.
# Optional: SIMKL_CLIENT_ID (docs/runbooks/simkl.md); unset leaves the Simkl import off.
supabase-deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: manual
  script:
    - pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
    - pnpm exec supabase db push --password "$SUPABASE_DB_PASSWORD"
    - pnpm exec supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
    - >
      pnpm exec supabase secrets set --project-ref "$SUPABASE_PROJECT_REF"
      TMDB_ACCESS_TOKEN="$TMDB_ACCESS_TOKEN" CLEANUP_SECRET="$CLEANUP_SECRET"
      ALLOWED_ORIGINS="$ALLOWED_ORIGINS" PUSH_SECRET="$PUSH_SECRET"
      FCM_SERVICE_ACCOUNT="$FCM_SERVICE_ACCOUNT"
    # Optional: an empty value would fail `secrets set`, so it is set only when present.
    - >
      [ -z "$SIMKL_CLIENT_ID" ] || pnpm exec supabase secrets set
      --project-ref "$SUPABASE_PROJECT_REF" SIMKL_CLIENT_ID="$SIMKL_CLIENT_ID"
    # The notifications trigger reads the push URL and secret from Vault; this keeps them in step.
    - >
      [ -z "$PUSH_SECRET" ] || pnpm exec supabase db query --linked
      "select public.configure_push('$SUPABASE_URL/functions/v1/push', '$PUSH_SECRET')"
      > /dev/null

# Staging Supabase: migrations and Edge Functions to a second project. Manual, from an MR pipeline
# or a "Run pipeline" (web) pipeline on a release integration branch named <issue>-v<major>-<minor>
# (1-v0-1, 2-v0-2, ...), so no version is hard-coded; set STAGING_BRANCH to allow another branch.
# Needs STAGING_SUPABASE_ACCESS_TOKEN, STAGING_SUPABASE_PROJECT_REF, STAGING_SUPABASE_DB_PASSWORD
# (docs/runbooks/secrets.md); without them the job passes as a no-op.
supabase-deploy-staging:
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH =~ /^[0-9]+-v[0-9]+-[0-9]+$/
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web" && $STAGING_BRANCH && $CI_COMMIT_BRANCH == $STAGING_BRANCH
      when: manual
      allow_failure: true
  script:
    - |
      if [ -z "$STAGING_SUPABASE_ACCESS_TOKEN" ] || [ -z "$STAGING_SUPABASE_PROJECT_REF" ] \
        || [ -z "$STAGING_SUPABASE_DB_PASSWORD" ]; then
        echo "Skipping staging deploy: set STAGING_SUPABASE_ACCESS_TOKEN, STAGING_SUPABASE_PROJECT_REF"
        echo "and STAGING_SUPABASE_DB_PASSWORD (see docs/runbooks/secrets.md)."
        exit 0
      fi
      export SUPABASE_ACCESS_TOKEN="$STAGING_SUPABASE_ACCESS_TOKEN"
      pnpm exec supabase link --project-ref "$STAGING_SUPABASE_PROJECT_REF" \
        --password "$STAGING_SUPABASE_DB_PASSWORD"
      pnpm exec supabase db push --password "$STAGING_SUPABASE_DB_PASSWORD"
      pnpm exec supabase functions deploy --project-ref "$STAGING_SUPABASE_PROJECT_REF"

# Free-tier projects pause after a week idle. A daily schedule keeps production awake
# and runs attachment cleanup.
keep-alive:
  stage: deploy
  before_script: []
  image: curlimages/curl:8.11.1
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - >
      curl -fsS "$SUPABASE_URL/rest/v1/" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -o /dev/null
    - >
      [ -z "$CLEANUP_SECRET" ] || curl -fsS -X POST "$SUPABASE_URL/functions/v1/attachments"
      -H "x-cleanup-secret: $CLEANUP_SECRET" -H "content-type: application/json"
      -d '{"action":"cleanup"}' -o /dev/null
